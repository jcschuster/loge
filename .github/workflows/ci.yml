name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        package: [loge, loge_tptp, loge_dimacs, loge_asp, loge_prolog, loge_egglog, loge_smtlib, loge_turtle, loge_sparql, loge_shex, kino_loge]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { elixir-version: "1.20", otp-version: "29" }
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kino_loge/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- ../lib/assets/editor.js
